ShortDescription: Accessible EPUB/PDF to audiobook converter for blind users
Description: |-
  Epub TTS Accesible is a Windows desktop application that converts EPUB and
  PDF books into multi-voice audiobooks. It is designed by and for blind
  people, with NVDA screen reader accessibility as a non-negotiable
  requirement.

  Supports cloud neural text-to-speech voices (Microsoft Azure, Amazon Polly,
  Deepgram Aura-2, ElevenLabs) as well as local SAPI5 voices (64-bit and
  32-bit via a compatibility bridge, including Eloquence/RealSpeak). Includes
  a Library manager for EPUB/PDF collections, a Reading mode with bookmarks
  and search, a full Audiobook Creator (whole book or by chapter), and a
  multi-voice Fragment Recording workflow using {{@character}} tags. The
  interface is available in Spanish and English.
